name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6.0.2

    - name: Set up tools via mise
      uses: jdx/mise-action@v4.0.1

    - name: Run Lua tests
      run: mise run test
